<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión 9: Costeñita con jQuery</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 20px;
        }
        .panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .tarjeta {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            border-left: 5px solid #ffaa00;
        }
        .precio {
            font-size: 1.2em;
            font-weight: bold;
            color: #004a99;
        }
        .pocoStock {
            border-left-color: #f39c12;
            background-color: #fffaf0;
        }
        .agotado {
            border-left-color: #e74c3c;
            background-color: #fdf2f2;
            opacity: 0.7;
        }
        .destacado {
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .formulario-pedido {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        select, button {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.95em;
        }
        button {
            background-color: #004a99;
            color: white;
            cursor: pointer;
            border: none;
            margin-left: 10px;
        }
        button:hover {
            background-color: #003366;
        }
        a.btn-volver {
            display: inline-block;
            margin-top: 20px;
            color: #004a99;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h1>Costeñita - Catálogo de Miel</h1>
        <p>Manejo Dinámico del DOM mediante jQuery 3.7.1</p>
        
        <!-- Elemento de Promoción (Chaining) -->
        <div id="avisoPromocion"></div>

        <!-- Panel de Resumen -->
        <div id="panelResumen">
            <p><strong>Total de Productos:</strong> <span id="totalProductos">0</span></p>
            <p><strong>Valor Total en Inventario:</strong> Bs <span id="valorInventario">0.00</span></p>
            <p><strong>Productos Agotados:</strong> <span id="totalAgotados">0</span></p>
        </div>

        <!-- Formulario con select dinámico (Para la Casa) -->
        <div class="formulario-pedido">
            <h3>Simulador de Pedido</h3>
            <label for="selectProductos"><strong>Seleccionar producto disponible:</strong> </label>
            <select id="selectProductos">
                <!-- Se llena dinámicamente con jQuery -->
            </select>
            <button type="button" id="btnProbarSeleccion">Ver producto elegido</button>
        </div>
    </div>

    <!-- Contenedor del Catálogo de Tarjetas -->
    <main id="catalogo" class="catalogo-grid"></main>

    <a href="index.html" class="btn-volver">← Volver al Menú Principal</a>

    <!-- Carga de la librería jQuery vía CDN antes de nuestro script -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="sesion9.js"></script>
</body>
</html>
